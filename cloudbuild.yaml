steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bizness-backend', './server']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bizness-backend']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bizness-backend'
      - '--image=gcr.io/$PROJECT_ID/bizness-backend'
      - '--region=europe-west1'
      - '--platform=managed'
images:
  - 'gcr.io/$PROJECT_ID/bizness-backend'
options:
  logging: CLOUD_LOGGING_ONLY
