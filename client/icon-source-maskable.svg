<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6E4F"/>
      <stop offset="100%" stop-color="#0A5A41"/>
    </linearGradient>
  </defs>
  <!-- Maskable icons get cropped to a circle/squircle by the OS, so all
       meaningful content stays within the inner ~80% safe zone (per the
       W3C maskable icon spec) rather than extending to the edges. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#F4F1EA">
    <rect x="158" y="298" width="56" height="112" rx="9"/>
    <rect x="242" y="244" width="56" height="166" rx="9"/>
    <rect x="326" y="184" width="56" height="226" rx="9"/>
  </g>
  <circle cx="354" cy="152" r="19" fill="#D4A83A"/>
</svg>
