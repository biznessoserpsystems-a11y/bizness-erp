<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6E4F"/>
      <stop offset="100%" stop-color="#0A5A41"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- A simple upward bar-chart mark, referencing the app's own dashboards/BI identity -->
  <g fill="#F4F1EA">
    <rect x="128" y="288" width="64" height="128" rx="10"/>
    <rect x="224" y="224" width="64" height="192" rx="10"/>
    <rect x="320" y="152" width="64" height="264" rx="10"/>
  </g>
  <!-- A small accent dot, echoing the Cedi currency mark this brand color is named for -->
  <circle cx="352" cy="112" r="22" fill="#D4A83A"/>
</svg>
