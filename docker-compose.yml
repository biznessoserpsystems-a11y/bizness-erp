version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bizness-os-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biznes_os}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file next to docker-compose.yml}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: